# Builds the downloads for a version tag (browser extension, Windows installer, Android APK) and
# attaches them to a draft release that a maintainer reviews and publishes by hand.
# Standard GitHub-hosted runners only; every job is skipped while the repository is private.
#
# Nothing here is signed with a project key: the Windows installer is unsigned (SmartScreen warns on
# first start) and the APK carries the debug signature of the build. Both are meant for sideloading.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extension:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kortex/extension zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: apps/extension/.output/*.zip
          include-hidden-files: true
          if-no-files-found: error

  windows:
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: pnpm install --frozen-lockfile
      # License texts of every shipped npm package, Rust crate and the bundled Node.js runtime: inside the
      # installer (the sidecar folder is bundled as resources) and next to every download of the release.
      - run: node scripts/third-party-notices.mjs --out THIRD-PARTY-NOTICES.md
      - run: pnpm --filter @kortex/desktop tauri build
      - run: Copy-Item THIRD-PARTY-NOTICES.md apps/desktop/src-tauri/target/release/bundle/nsis/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/THIRD-PARTY-NOTICES.md
          if-no-files-found: error

  android:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      # ANDROID_HOME is preset on the runner image; the script runs `expo prebuild` and gradle.
      - run: node scripts/build-android.mjs --arch arm64-v8a,armeabi-v7a
        working-directory: apps/mobile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  draft-release:
    if: ${{ !github.event.repository.private && startsWith(github.ref, 'refs/tags/v') }}
    needs: [extension, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes ./*
