# Contributor license agreement (CLA.md): asks every first-time contributor to sign on the pull request
# and records the signature (GitHub account and date) in signatures/cla.json on the branch
# `cla-signatures`. Free: standard runner, no app, no outside service. Skipped while the repository is
# private. One-time setup by the maintainer when the repository goes public: create the branch
# `cla-signatures` (`git switch --orphan cla-signatures && git commit --allow-empty -m "CLA signatures"
# && git push origin cla-signatures`).
#
# pull_request_target runs with the repository token on pull requests from forks; this job never checks
# out or runs code of the pull request, it only reads comments and writes the signature file.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      ${{ !github.event.repository.private && (
        github.event_name == 'pull_request_target' ||
        (github.event.issue.pull_request && (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        ))
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/moe-spiration/openkortex/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The repository owner (maintainer) signs nothing: their PRs need no CLA.
          allowlist: ${{ github.repository_owner }},bot*,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
