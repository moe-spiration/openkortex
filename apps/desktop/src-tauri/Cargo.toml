[package]
license = "AGPL-3.0-only"
name = "kortex-desktop"
version = "0.6.4"
description = "Kortex for Windows: meeting HUD, dual-channel audio capture, Alt+Space quick capture"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (Tauri template convention).
name = "kortex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
# kortex://connect deep link from the web app (Einstellungen → "Mit Windows-App verbinden").
tauri-plugin-deep-link = "2"
# A second start (e.g. by the deep link) hands its arguments to the running app and exits.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Windows notifications for due reminders and radar changes (reminders.rs).
tauri-plugin-notification = "2"
# Vault folder picker in the settings window (vault.rs; called from Rust, no JS permission).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Record-then-upload: Supabase auth + /api/chat/transcribe + /api/ingest.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
# Refresh token in the Windows Credential Manager (review N5 #17).
keyring = { version = "3", features = ["windows-native"] }

# Audio: cpal for the microphone and (on WASAPI) loopback capture of the default output device.
cpal = "0.15"
# Lock-free SPSC ring buffers between the capture callbacks and the DSP thread.
ringbuf = "0.4"
# Sample-rate conversion 44.1/48 kHz -> 16 kHz per channel.
rubato = "0.16"

# Deepgram streaming over WebSocket.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
# Launcher: clipboard, SendInput (Ctrl+C / Ctrl+V) and focus of the previous window (inject.rs).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
